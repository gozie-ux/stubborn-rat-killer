<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Concrete Floor Background -->
    <linearGradient id="warehouseFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Natural Wood / Plywood Grain Gradient -->
    <linearGradient id="plywoodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Heavy Shadow -->
    <filter id="woodPlankShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Concrete Warehouse Floor -->
  <rect width="1000" height="600" fill="url(#warehouseFloor)" />

  <!-- Top Wall / Pallet Skirting Board -->
  <rect x="0" y="0" width="1000" height="70" fill="#334155" stroke="#1e293b" stroke-width="2" />
  <line x1="0" y1="70" x2="1000" y2="70" stroke="#0f172a" stroke-width="4" />
  <!-- Wooden pallet studs at top -->
  <rect x="50" y="5" width="220" height="55" fill="#78350f" rx="3" opacity="0.7" />
  <rect x="380" y="5" width="220" height="55" fill="#78350f" rx="3" opacity="0.7" />
  <rect x="710" y="5" width="220" height="55" fill="#78350f" rx="3" opacity="0.7" />

  <!-- LONG PLYWOOD PLANK TRAP WITH TEMOBI GUM (Diagonal Across Warehouse Floor) -->
  <g transform="translate(180, 70)" filter="url(#woodPlankShadow)">
    <!-- Wooden Plank Contour (Angled Plank Trapping Surface) -->
    <polygon points="120,0 340,0 260,490 40,490" fill="url(#plywoodGrad)" stroke="#78350f" stroke-width="2" />

    <!-- Wood Grain Strands -->
    <line x1="160" y1="0" x2="80" y2="490" stroke="#92400e" stroke-width="1.5" opacity="0.4" />
    <line x1="220" y1="0" x2="140" y2="490" stroke="#78350f" stroke-width="1.5" opacity="0.3" />
    <line x1="280" y1="0" x2="200" y2="490" stroke="#92400e" stroke-width="1.5" opacity="0.4" />

    <!-- Clear Adhesive Layer Sheen on Plank -->
    <polygon points="135,20 325,20 250,460 60,460" fill="#ffffff" opacity="0.2" />

    <!-- TRAPPED RODENT 1 (Upper Plank) -->
    <g transform="translate(200, 110)">
      <!-- Sticky Trap Glue Swirls -->
      <ellipse cx="10" cy="10" rx="35" ry="20" fill="#ffffff" opacity="0.3" />
      <!-- Rat Body (Gray Fur) -->
      <ellipse cx="10" cy="10" rx="24" ry="14" fill="#475569" stroke="#334155" stroke-width="1" />
      <circle cx="-10" cy="10" r="8" fill="#334155" />
      <!-- Tail stuck in glue -->
      <path d="M 32,10 Q 55,25 45,45" stroke="#64748b" stroke-width="2.5" fill="none" />
      <!-- Paws glued tight -->
      <circle cx="-5" cy="22" r="3" fill="#cbd5e1" />
      <circle cx="20" cy="20" r="3" fill="#cbd5e1" />
    </g>

    <!-- TRAPPED RODENT 2 (Lower Plank) -->
    <g transform="translate(140, 260)">
      <!-- Sticky Trap Glue Pool -->
      <ellipse cx="15" cy="15" rx="42" ry="25" fill="#ffffff" opacity="0.35" />
      <!-- Large Sewer Rat Body -->
      <ellipse cx="15" cy="15" rx="32" ry="18" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="-14" cy="14" r="10" fill="#1e293b" />
      <!-- Tail -->
      <path d="M 45,15 Q 75,30 90,10" stroke="#475569" stroke-width="3" fill="none" />
      <!-- Immobilized feet -->
      <circle cx="-5" cy="30" r="4" fill="#94a3b8" />
      <circle cx="28" cy="28" r="4" fill="#94a3b8" />
    </g>

    <!-- Bait wrapper at base of board -->
    <polygon points="100,420 140,430 130,460 90,450" fill="#ffffff" opacity="0.7" stroke="#cbd5e1" stroke-width="1" />

    <!-- KILLAPEST RESOURCES VERIFIED WATERMARK (Red Stencil Running Across Board) -->
    <g transform="translate(30, 460) rotate(-66)">
      <text x="0" y="0" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="34" fill="#ef4444" opacity="0.85" letter-spacing="3">
        KillaPest Resources
      </text>
    </g>
  </g>

  <!-- Left Side Badges / Attributes -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="280" height="190" rx="14" fill="#0f172a" opacity="0.95" stroke="#ef4444" stroke-width="2" />
    <text x="20" y="36" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#f87171">
      PROVEN FIELD CATCH
    </text>
    <text x="20" y="58" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#fca5a5">
      KillaPest Real Warehouse Eradication
    </text>

    <line x1="20" y1="72" x2="260" y2="72" stroke="#334155" stroke-width="1" />

    <text x="20" y="98" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#4ade80">
      ✓ Instant Immobilization on Touch
    </text>
    <text x="20" y="122" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#ffffff">
      ✓ Traps Multiple Giant Sewer Rats
    </text>
    <text x="20" y="146" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#facc15">
      ✓ Zero Poison Risk in Food Stores
    </text>
    <text x="20" y="170" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#38bdf8">
      ✓ Easy Disposal &amp; Reusable Wood
    </text>
  </g>

  <!-- Right Side How It Works Panel -->
  <g transform="translate(680, 110)">
    <rect x="0" y="0" width="280" height="340" rx="14" fill="#0f172a" opacity="0.95" stroke="#334155" stroke-width="2" />
    <text x="20" y="36" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#facc15">
      HOW TO APPLY
    </text>
    <line x1="20" y1="50" x2="260" y2="50" stroke="#334155" stroke-width="1" />

    <g transform="translate(20, 75)">
      <circle cx="12" cy="12" r="12" fill="#dc2626" />
      <text x="12" y="17" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
      <text x="35" y="12" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#ffffff">Squeeze on Board</text>
      <text x="35" y="28" font-family="'Outfit', sans-serif" font-weight="500" font-size="10.5" fill="#94a3b8">Apply evenly on flat wood or plastic</text>
    </g>

    <g transform="translate(20, 140)">
      <circle cx="12" cy="12" r="12" fill="#dc2626" />
      <text x="12" y="17" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">2</text>
      <text x="35" y="12" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#ffffff">Place on Wall Edge</text>
      <text x="35" y="28" font-family="'Outfit', sans-serif" font-weight="500" font-size="10.5" fill="#94a3b8">Position along rodent run corners</text>
    </g>

    <g transform="translate(20, 205)">
      <circle cx="12" cy="12" r="12" fill="#dc2626" />
      <text x="12" y="17" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">3</text>
      <text x="35" y="12" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#ffffff">Check Trap Daily</text>
      <text x="35" y="28" font-family="'Outfit', sans-serif" font-weight="500" font-size="10.5" fill="#94a3b8">Check trap and remove captured pests</text>
    </g>

    <g transform="translate(20, 275)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#15803d" />
      <text x="120" y="26" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">
        135g KOLLANT TEMOBI GLUE
      </text>
    </g>
  </g>
</svg>
