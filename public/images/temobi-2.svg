<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Background Neutral Studio Surface Gradient -->
    <linearGradient id="studioPaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Clear Translucent Viscous Gel Gradient -->
    <radialGradient id="clearGelGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#f8fafc" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#cbd5e1" stop-opacity="0.6" />
      <stop offset="95%" stop-color="#64748b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9" />
    </radialGradient>

    <!-- Gel High-Gloss Refraction Light -->
    <linearGradient id="gelHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Tube Tip Red / Gold -->
    <linearGradient id="tubeTipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <filter id="gelDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background Base Surface -->
  <rect width="1000" height="600" fill="url(#studioPaperGrad)" />

  <!-- Studio Surface Texture Grid -->
  <pattern id="cardboardGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.3" />
  </pattern>
  <rect width="1000" height="600" fill="url(#cardboardGrid)" />

  <!-- VISCOUS ADHESIVE PUDDLE (Applied On Surface) -->
  <g transform="translate(180, 180)" filter="url(#gelDropShadow)">
    <!-- Base Gel Pool Contour (High-Tack Viscous Shape) -->
    <path d="M 120,80 C 180,30 360,20 440,70 C 520,120 540,240 480,290 C 420,340 220,350 140,310 C 60,270 50,140 120,80 Z" 
          fill="url(#clearGelGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />

    <!-- Secondary Thick Spread Layer -->
    <path d="M 160,110 C 210,70 330,60 400,100 C 460,140 470,220 430,260 C 380,300 240,310 180,280 C 120,240 110,150 160,110 Z" 
          fill="#ffffff" opacity="0.25" />

    <!-- Specular Light Sheen Reflections (High-Tack Glassy Highlights) -->
    <ellipse cx="280" cy="140" rx="90" ry="35" fill="url(#gelHighlight)" transform="rotate(-15 280 140)" />
    <ellipse cx="220" cy="200" rx="60" ry="25" fill="url(#gelHighlight)" transform="rotate(10 220 200)" />
    <ellipse cx="410" cy="210" rx="45" ry="20" fill="url(#gelHighlight)" transform="rotate(-30 410 210)" />

    <!-- Micro-bubbles inside viscous glue -->
    <circle cx="210" cy="140" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="230" cy="160" r="3" fill="#ffffff" opacity="0.9" />
    <circle cx="340" cy="190" r="5" fill="#ffffff" opacity="0.8" />
    <circle cx="310" cy="220" r="3.5" fill="#ffffff" opacity="0.85" />
    <circle cx="390" cy="160" r="4.5" fill="#ffffff" opacity="0.9" />
    <circle cx="260" cy="240" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- KOLLANT TEMOBI SQUEEZE TUBE DISPENSING GLUE (Top Right Diagonal) -->
  <g transform="translate(620, 20) rotate(42)" filter="url(#gelDropShadow)">
    <!-- Red/Yellow Tube Body -->
    <path d="M 0,0 L 260,0 L 260,130 L 0,130 Z" fill="url(#tubeTipGrad)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Yellow Brand Label Block -->
    <polygon points="40,20 180,20 200,110 60,110" fill="#facc15" />
    <text x="110" y="80" font-family="'Impact', 'Outfit', sans-serif" font-weight="900" font-size="52" fill="#dc2626" font-style="italic">
      TEMO
    </text>

    <!-- Aluminum Nozzle Base -->
    <polygon points="0,25 -30,35 -30,95 0,105" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Threaded Nozzle Tube Neck -->
    <rect x="-65" y="42" width="35" height="46" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" />
    <line x1="-55" y1="42" x2="-55" y2="88" stroke="#ffffff" stroke-width="1.5" />
    <line x1="-45" y1="42" x2="-45" y2="88" stroke="#ffffff" stroke-width="1.5" />

    <!-- Glue Oozing Stream From Nozzle -->
    <path d="M -65,50 C -110,50 -130,110 -180,140 C -140,150 -110,80 -65,80 Z" fill="url(#clearGelGrad)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Left Side Technical Callout -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="320" height="150" rx="14" fill="#0f172a" opacity="0.95" stroke="#ef4444" stroke-width="1.5" />
    <text x="20" y="32" font-family="'Outfit', sans-serif" font-weight="900" font-size="15" fill="#f87171">
      CRYSTAL VISCOUS ADHESIVE
    </text>
    <line x1="20" y1="46" x2="300" y2="46" stroke="#334155" stroke-width="1" />
    <text x="20" y="70" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#4ade80">
      ✓ Non-Drying Formula — Never Hardens
    </text>
    <text x="20" y="94" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#facc15">
      ✓ Industrial Ultra-High Tack Adhesive
    </text>
    <text x="20" y="118" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#ffffff">
      ✓ Odourless, Clear &amp; 100% Non-Poisonous
    </text>
  </g>

  <!-- Bottom Instructions Card -->
  <g transform="translate(50, 490)">
    <rect x="0" y="0" width="900" height="70" rx="12" fill="#0f172a" opacity="0.95" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="30" font-family="'Outfit', sans-serif" font-weight="900" font-size="13" fill="#facc15">
      APPLICATION TIP:
    </text>
    <text x="30" y="52" font-family="'Outfit', sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">
      Squeeze in zigzag ribbons onto plywood, plastic, or cardboard. Spread evenly and place flush against wall corners.
    </text>
  </g>
</svg>
