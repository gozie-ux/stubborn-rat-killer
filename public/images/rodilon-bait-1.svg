<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Studio Draped White Fabric Background -->
    <radialGradient id="studioFabricBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <!-- Blue Extruded Bait Block Gradient -->
    <linearGradient id="blueBlockLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="blueBlockDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="60%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Translucent Plastic Bag Sheen -->
    <linearGradient id="plasticSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    <filter id="textGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#studioFabricBg)" />
  
  <!-- Ambient Fabric folds -->
  <path d="M 0,200 Q 300,280 600,180 T 1000,240 L 1000,600 L 0,600 Z" fill="#f8fafc" opacity="0.7" />
  <path d="M 0,420 Q 400,380 750,490 T 1000,450 L 1000,600 L 0,600 Z" fill="#e2e8f0" opacity="0.4" />

  <!-- Left Product Information Typography -->
  <g transform="translate(60, 50)">
    <!-- KillAPest Resources Title -->
    <text x="30" y="80" font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#ef4444" stroke="#7f1d1d" stroke-width="2" letter-spacing="1" filter="url(#textGlow)">
      KillAPest Resources
    </text>

    <!-- RODILON Brand Name -->
    <text x="30" y="210" font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="130" fill="#16a34a" letter-spacing="-2">
      RODILON
    </text>

    <!-- Pack size -->
    <text x="30" y="270" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="36" fill="#0f172a" letter-spacing="1">
      (62 BLOCKS) 1/2 KG
    </text>

    <!-- ANTICOAGULANT RODENT BAIT Title -->
    <text x="30" y="380" font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="50" fill="#ef4444" stroke="#991b1b" stroke-width="2" letter-spacing="1.5">
      ANTICOAGULANT
    </text>
    <text x="75" y="445" font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="50" fill="#ef4444" stroke="#991b1b" stroke-width="2" letter-spacing="1.5">
      RODENT BAIT
    </text>

    <!-- Secondary details badge -->
    <rect x="30" y="480" width="380" height="42" rx="10" fill="#0f172a" />
    <text x="45" y="508" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#facc15" letter-spacing="0.5">
      EXTRUDED WAX BLOCKS • ZERO RESISTANCE
    </text>
  </g>

  <!-- Right Hand holding the Transparent Sealed Bag of Blue Blocks -->
  <g transform="translate(480, 0)" filter="url(#dropGlow)">
    <!-- Hand / Fingers holding top of the bag -->
    <path d="M 230,-10 C 230,20 225,45 235,55 C 245,60 265,60 275,45 C 285,30 280,-10 280,-10 Z" fill="#5c3826" />
    <path d="M 255,-10 C 255,25 250,55 260,65 C 270,70 290,65 300,50 C 310,35 305,-10 305,-10 Z" fill="#4a2c1d" />
    <path d="M 280,-10 C 280,20 275,50 285,60 C 295,65 315,60 325,45 C 335,30 330,-10 330,-10 Z" fill="#3d2316" />

    <!-- Twisted/Knotted Top of transparent plastic bag -->
    <path d="M 245,35 Q 260,110 240,160 Q 280,110 275,35 Z" fill="#f1f5f9" opacity="0.9" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 240,160 Q 200,210 140,290 L 410,290 Q 330,210 275,160 Z" fill="#e2e8f0" opacity="0.35" />

    <!-- Shadow at bottom of the bag -->
    <ellipse cx="270" cy="565" rx="190" ry="25" fill="#64748b" opacity="0.35" />

    <!-- Transparent Bag Outer Contour Filled with Blue Wax Blocks -->
    <!-- Lower Bag Outline -->
    <path d="M 140,290 C 80,350 70,440 95,500 C 120,555 190,565 270,565 C 360,565 425,550 455,490 C 485,430 470,345 410,290 Z" fill="#082f49" stroke="#94a3b8" stroke-width="2" />

    <!-- BLUE EXTRUDED WAX BLOCKS PACKED INSIDE (Layer 1) -->
    <!-- Individual multi-faceted extruded blocks with bevel highlights -->
    <g stroke="#082f49" stroke-width="1.5" stroke-linejoin="round">
      <!-- Block 1 -->
      <polygon points="120,440 160,420 180,455 140,480" fill="url(#blueBlockLight)" />
      <polygon points="160,420 195,430 180,455" fill="url(#blueBlockDark)" />
      
      <!-- Block 2 -->
      <polygon points="180,450 230,440 245,485 190,495" fill="url(#blueBlockLight)" />
      <polygon points="230,440 260,460 245,485" fill="url(#blueBlockDark)" />

      <!-- Block 3 -->
      <polygon points="245,465 295,450 315,495 260,510" fill="url(#blueBlockLight)" />
      <polygon points="295,450 330,470 315,495" fill="url(#blueBlockDark)" />

      <!-- Block 4 -->
      <polygon points="310,475 365,460 380,505 325,520" fill="url(#blueBlockLight)" />
      <polygon points="365,460 395,480 380,505" fill="url(#blueBlockDark)" />

      <!-- Block 5 -->
      <polygon points="370,450 420,430 440,470 390,490" fill="url(#blueBlockLight)" />
      <polygon points="420,430 450,450 440,470" fill="url(#blueBlockDark)" />

      <!-- Middle Layer Blocks -->
      <!-- Block 6 -->
      <polygon points="140,380 185,360 205,400 160,420" fill="url(#blueBlockLight)" />
      <polygon points="185,360 215,380 205,400" fill="url(#blueBlockDark)" />

      <!-- Block 7 -->
      <polygon points="200,390 250,375 270,420 215,435" fill="url(#blueBlockLight)" />
      <polygon points="250,375 285,395 270,420" fill="url(#blueBlockDark)" />

      <!-- Block 8 -->
      <polygon points="265,395 320,380 335,425 280,440" fill="url(#blueBlockLight)" />
      <polygon points="320,380 350,400 335,425" fill="url(#blueBlockDark)" />

      <!-- Block 9 -->
      <polygon points="325,390 380,370 400,410 345,430" fill="url(#blueBlockLight)" />
      <polygon points="380,370 410,390 400,410" fill="url(#blueBlockDark)" />

      <!-- Block 10 -->
      <polygon points="390,380 435,365 450,405 405,425" fill="url(#blueBlockLight)" />
      <polygon points="435,365 460,385 450,405" fill="url(#blueBlockDark)" />

      <!-- Top Heap Layer Blocks -->
      <!-- Block 11 -->
      <polygon points="170,330 215,310 235,350 190,370" fill="url(#blueBlockLight)" />
      <polygon points="215,310 245,330 235,350" fill="url(#blueBlockDark)" />

      <!-- Block 12 -->
      <polygon points="230,320 285,305 305,350 250,365" fill="url(#blueBlockLight)" />
      <polygon points="285,305 320,325 305,350" fill="url(#blueBlockDark)" />

      <!-- Block 13 -->
      <polygon points="295,315 350,300 370,345 315,360" fill="url(#blueBlockLight)" />
      <polygon points="350,300 380,320 370,345" fill="url(#blueBlockDark)" />

      <!-- Block 14 -->
      <polygon points="355,320 405,305 425,350 375,365" fill="url(#blueBlockLight)" />
      <polygon points="405,305 435,325 425,350" fill="url(#blueBlockDark)" />

      <!-- Bottom Edge Blocks -->
      <!-- Block 15 -->
      <polygon points="135,490 180,480 195,520 150,535" fill="url(#blueBlockLight)" />
      <polygon points="180,480 210,500 195,520" fill="url(#blueBlockDark)" />

      <!-- Block 16 -->
      <polygon points="190,500 240,490 255,535 205,545" fill="url(#blueBlockLight)" />
      <polygon points="240,490 270,510 255,535" fill="url(#blueBlockDark)" />

      <!-- Block 17 -->
      <polygon points="250,510 305,495 320,540 265,555" fill="url(#blueBlockLight)" />
      <polygon points="305,495 335,515 320,540" fill="url(#blueBlockDark)" />

      <!-- Block 18 -->
      <polygon points="315,505 370,490 385,535 330,550" fill="url(#blueBlockLight)" />
      <polygon points="370,490 400,510 385,535" fill="url(#blueBlockDark)" />

      <!-- Block 19 -->
      <polygon points="375,490 425,475 440,515 390,530" fill="url(#blueBlockLight)" />
      <polygon points="425,475 450,495 440,515" fill="url(#blueBlockDark)" />

      <!-- Inner Fill Density Blocks -->
      <polygon points="210,350 255,335 270,375 225,390" fill="#0284c7" />
      <polygon points="280,355 330,340 345,385 295,400" fill="#0369a1" />
      <polygon points="170,410 215,395 230,435 185,450" fill="#0284c7" />
      <polygon points="230,420 280,405 295,450 245,465" fill="#075985" />
      <polygon points="290,425 345,410 360,455 305,470" fill="#0284c7" />
      <polygon points="350,420 400,405 415,445 365,460" fill="#0369a1" />
    </g>

    <!-- Translucent Plastic Film Highlights & Crinkles Over the Blocks -->
    <path d="M 140,290 C 80,350 70,440 95,500 C 120,555 190,565 270,565 C 360,565 425,550 455,490 C 485,430 470,345 410,290 Z" fill="url(#plasticSheen)" />

    <!-- Plastic Crinkle Highlights -->
    <path d="M 180,260 Q 250,330 220,440" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 330,260 Q 290,350 350,460" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 120,380 Q 180,450 160,520" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 430,360 Q 380,440 400,510" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 230,120 L 250,220" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7" />
    <path d="M 270,110 L 280,210" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
