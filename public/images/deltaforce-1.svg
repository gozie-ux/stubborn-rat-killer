<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgDelta" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f223d" />
      <stop offset="50%" stop-color="#081324" />
      <stop offset="100%" stop-color="#020710" />
    </radialGradient>

    <!-- Royal Blue Cap Gradient -->
    <linearGradient id="blueCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- White Bottle Body with plastic sheen -->
    <linearGradient id="whiteBottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="25%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Deep Blue Label Banner Gradient -->
    <linearGradient id="labelBlueBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Bottom Yellow/Green Stripe -->
    <linearGradient id="yellowGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <filter id="bottleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="600" fill="url(#bgDelta)" />

  <!-- Studio Platform Glow -->
  <ellipse cx="500" cy="530" rx="360" ry="35" fill="#3b82f6" opacity="0.15" />
  <ellipse cx="500" cy="530" rx="260" ry="22" fill="#000000" opacity="0.7" />

  <!-- MAIN DELTAFORCE 1 LITRE BOTTLE -->
  <g transform="translate(360, 40)" filter="url(#bottleShadow)">
    <!-- BOTTLE OUTLINE / SILHOUETTE -->
    
    <!-- White Bottle Body Cylinder -->
    <rect x="20" y="150" width="240" height="340" rx="14" fill="url(#whiteBottleGrad)" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M 20,470 Q 140,495 260,470 L 260,490 Q 140,505 20,490 Z" fill="#94a3b8" />

    <!-- Rounded Shoulder & Cone Taper -->
    <path d="M 20,160 C 20,120 70,60 140,50 C 210,60 260,120 260,160 Z" fill="url(#whiteBottleGrad)" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Blue Cap Over Cone Top -->
    <path d="M 45,150 C 45,95 85,30 140,20 C 195,30 235,95 235,150 Z" fill="url(#blueCapGrad)" stroke="#1e40af" stroke-width="2" />
    <!-- Cap Sheen highlight -->
    <path d="M 105,35 Q 140,25 175,35 Q 160,120 140,140 Q 120,120 105,35" fill="#60a5fa" opacity="0.4" />

    <!-- Safety Shrink Seal on Cap Neck -->
    <line x1="45" y1="145" x2="235" y2="145" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />

    <!-- FRONT LABEL WRAP -->
    <g transform="translate(20, 160)">
      <!-- Label Background Base -->
      <rect x="0" y="0" width="240" height="310" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

      <!-- Top Dark Blue Arc Banner -->
      <path d="M 0,0 L 240,0 L 240,85 C 200,95 40,95 0,85 Z" fill="url(#labelBlueBanner)" />

      <!-- DELTAFORCE BRAND LOGO -->
      <text x="120" y="48" font-family="'Impact', 'Outfit', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="1" text-anchor="middle">
        DELTA<tspan font-style="italic" font-weight="400" fill="#93c5fd">force</tspan>
      </text>

      <!-- Active Ingredient Subtitle -->
      <text x="120" y="70" font-family="'Outfit', sans-serif" font-weight="700" font-size="10" fill="#bfdbfe" text-anchor="middle">
        Deltamethrin 1.25g /L EC
      </text>

      <!-- Thin Green Divider Line -->
      <path d="M 0,88 C 40,98 200,98 240,88" stroke="#16a34a" stroke-width="2.5" fill="none" />

      <!-- TARGET PESTS CROSSHAIR CIRCLES (Iconography) -->
      <!-- Circle 1: Termite / Woodborer (Top Left) -->
      <g transform="translate(80, 140)">
        <circle cx="0" cy="0" r="28" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.5" />
        <line x1="-34" y1="0" x2="34" y2="0" stroke="#1e3a8a" stroke-width="1" />
        <line x1="0" y1="-34" x2="0" y2="34" stroke="#1e3a8a" stroke-width="1" />
        <!-- Termite graphic -->
        <ellipse cx="0" cy="0" rx="9" ry="14" fill="#ea580c" />
        <circle cx="0" cy="-12" r="5" fill="#c2410c" />
        <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#9a3412" stroke-width="1.5" />
        <line x1="-12" y1="5" x2="12" y2="5" stroke="#9a3412" stroke-width="1.5" />
        <text x="0" y="24" font-family="'Outfit', sans-serif" font-weight="800" font-size="7" fill="#1e3a8a" text-anchor="middle">TERMITE</text>
      </g>

      <!-- Circle 2: Caterpillar / Armyworm (Bottom Left) -->
      <g transform="translate(80, 205)">
        <circle cx="0" cy="0" r="28" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.5" />
        <line x1="-34" y1="0" x2="34" y2="0" stroke="#1e3a8a" stroke-width="1" />
        <line x1="0" y1="-34" x2="0" y2="34" stroke="#1e3a8a" stroke-width="1" />
        <!-- Caterpillar curved body -->
        <path d="M -12,8 Q -15,-8 0,-8 Q 15,-8 12,8" stroke="#15803d" stroke-width="6" stroke-linecap="round" fill="none" />
        <circle cx="12" cy="8" r="3" fill="#14532d" />
        <text x="0" y="24" font-family="'Outfit', sans-serif" font-weight="800" font-size="7" fill="#1e3a8a" text-anchor="middle">ARMYWORM</text>
      </g>

      <!-- Circle 3: Cockroach (Bottom Center-Right) -->
      <g transform="translate(155, 235)">
        <circle cx="0" cy="0" r="28" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.5" />
        <line x1="-34" y1="0" x2="34" y2="0" stroke="#1e3a8a" stroke-width="1" />
        <line x1="0" y1="-34" x2="0" y2="34" stroke="#1e3a8a" stroke-width="1" />
        <!-- Cockroach oval & antennae -->
        <ellipse cx="0" cy="0" rx="9" ry="15" fill="#991b1b" />
        <ellipse cx="0" cy="0" rx="6" ry="12" fill="#b91c1c" />
        <path d="M -2,-13 Q -10,-24 -15,-20" stroke="#7f1d1d" stroke-width="1" fill="none" />
        <path d="M 2,-13 Q 10,-24 15,-20" stroke="#7f1d1d" stroke-width="1" fill="none" />
        <text x="0" y="24" font-family="'Outfit', sans-serif" font-weight="800" font-size="7" fill="#1e3a8a" text-anchor="middle">COCKROACH</text>
      </g>

      <!-- Circle 4: Locust / Weevil (Top Right) -->
      <g transform="translate(165, 170)">
        <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.5" />
        <line x1="-28" y1="0" x2="28" y2="0" stroke="#1e3a8a" stroke-width="1" />
        <line x1="0" y1="-28" x2="0" y2="28" stroke="#1e3a8a" stroke-width="1" />
        <ellipse cx="0" cy="0" rx="8" ry="11" fill="#78350f" />
        <text x="0" y="20" font-family="'Outfit', sans-serif" font-weight="800" font-size="6" fill="#1e3a8a" text-anchor="middle">LOCUST</text>
      </g>

      <!-- Bottom Banner & 1L Badge -->
      <rect x="0" y="275" width="240" height="35" fill="url(#yellowGreenGrad)" />
      <g transform="translate(15, 280)">
        <rect x="0" y="0" width="38" height="24" rx="4" fill="#1e3a8a" />
        <text x="19" y="17" font-family="'Impact', 'Outfit', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">
          1L
        </text>
      </g>
      <text x="65" y="296" font-family="'Outfit', sans-serif" font-weight="800" font-size="9" fill="#0f172a">
        AGRICULTURAL & RESIDENTIAL INSECTICIDE
      </text>
    </g>
  </g>

  <!-- Left Side Highlights Card -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="260" height="200" rx="16" fill="#0f172a" opacity="0.9" stroke="#3b82f6" stroke-width="1.5" />
    <text x="20" y="35" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#60a5fa">
      DELTAFORCE 1 LITRE
    </text>
    <text x="20" y="58" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#cbd5e1">
      Deltamethrin 1.25g/L EC
    </text>
    
    <line x1="20" y1="72" x2="240" y2="72" stroke="#334155" stroke-width="1" />

    <text x="20" y="96" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#facc15">
      ✓ Kills Termites, Roaches & Weevils
    </text>
    <text x="20" y="120" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#4ade80">
      ✓ Fast Contact & Ingestion Action
    </text>
    <text x="20" y="144" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#ffffff">
      ✓ Highly Concentrated (Dilutes into Litres)
    </text>
    <text x="20" y="168" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#93c5fd">
      ✓ NAFDAC Reg. No: A5-0922
    </text>
  </g>

  <!-- Right Side Dosage Card -->
  <g transform="translate(680, 140)">
    <rect x="0" y="0" width="260" height="200" rx="16" fill="#0f172a" opacity="0.9" stroke="#eab308" stroke-width="1.5" />
    <text x="20" y="35" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#facc15">
      APPLICATION DOSAGE
    </text>
    <text x="20" y="58" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#cbd5e1">
      Knapsack & Spray Mixing
    </text>

    <line x1="20" y1="72" x2="240" y2="72" stroke="#334155" stroke-width="1" />

    <text x="20" y="100" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#ffffff">
      • 20ml – 40ml
    </text>
    <text x="32" y="120" font-family="'Outfit', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">
      per 15 Litre Knapsack Sprayer
    </text>

    <text x="20" y="152" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#38bdf8">
      • 0.5L – 1.0L
    </text>
    <text x="32" y="172" font-family="'Outfit', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">
      per Hectare / 400L Water Mix
    </text>
  </g>
</svg>
