<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <!-- Solid Warm Studio Yellow Background Matching Uploaded Photo -->
    <radialGradient id="yellowBg2" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#f8c818" />
      <stop offset="60%" stop-color="#e2a507" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <!-- Red Ribbed Cap Gradient -->
    <linearGradient id="redCapGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881313" />
      <stop offset="15%" stop-color="#b91c1c" />
      <stop offset="35%" stop-color="#dc2626" />
      <stop offset="55%" stop-color="#ef4444" />
      <stop offset="75%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Rat Bait Granules Pattern -->
    <pattern id="baitGranulesMat2" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#44403c" />
      <circle cx="4" cy="4" r="2.2" fill="#78716c" />
      <circle cx="12" cy="3" r="1.8" fill="#a8a29e" />
      <circle cx="15" cy="9" r="2.5" fill="#292524" />
      <circle cx="7" cy="13" r="1.9" fill="#d6d3d1" />
      <circle cx="14" cy="15" r="2.2" fill="#1c1917" />
      <circle cx="3" cy="16" r="1.5" fill="#57534e" />
      <circle cx="9" cy="8" r="1.4" fill="#e7e5e4" />
    </pattern>

    <filter id="stackShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3f2700" flood-opacity="0.7" />
    </filter>

    <g id="miniJar">
      <!-- Outer Plastic Bottle Shell -->
      <rect x="0" y="80" width="230" height="430" rx="32" fill="url(#baitGranulesMat2)" stroke="#44403c" stroke-width="2" />
      
      <!-- Label Body -->
      <path d="M 15 140 Q 115 150 215 140 L 215 440 Q 115 455 15 440 Z" fill="#d91b1b" stroke="#ffffff" stroke-width="2.5" />
      
      <!-- STUBBORN Text -->
      <text x="115" y="200" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="36" fill="#ffffff" stroke="#111111" stroke-width="2" text-anchor="middle">
        STUBBORN
      </text>

      <!-- Lightning -->
      <polygon points="25,160 100,270 70,275 110,325 50,265 80,260" fill="#facc15" stroke="#ca8a04" stroke-width="1" />
      <polygon points="205,160 130,270 160,275 120,325 180,265 150,260" fill="#facc15" stroke="#ca8a04" stroke-width="1" />

      <!-- Center Yellow Oval Frame -->
      <ellipse cx="115" cy="305" rx="55" ry="30" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
      
      <!-- Rats -->
      <ellipse cx="125" cy="305" rx="16" ry="11" fill="#1c1917" />
      <circle cx="138" cy="303" r="7" fill="#1c1917" />
      <circle cx="144" cy="303" r="1.5" fill="#ef4444" />
      <ellipse cx="102" cy="310" rx="9" ry="6" fill="#1c1917" />

      <!-- Bottom Black Banner with "RAT KILLER" -->
      <path d="M 25 410 Q 115 425 205 410 L 200 480 Q 115 490 30 480 Z" fill="#0a0a0a" stroke="#ffffff" stroke-width="1.5" />
      <text x="115" y="445" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">
        RAT
      </text>
      <text x="115" y="472" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">
        KILLER
      </text>

      <!-- Vertical Phone Call Strip on Right -->
      <g transform="translate(192, 215)">
        <rect x="0" y="0" width="18" height="150" rx="9" fill="#ffffff" />
        <circle cx="9" cy="11" r="5" fill="#d91b1b" />
        <text transform="translate(13, 140) rotate(-90)" font-family="'Arial Black', sans-serif" font-weight="900" font-size="7.5" fill="#d91b1b">
          09021991896
        </text>
      </g>

      <!-- Red Ribbed Cap -->
      <rect x="15" y="0" width="200" height="85" rx="10" fill="url(#redCapGrad2)" stroke="#5c0d0d" stroke-width="2" />
      <g stroke="#7f1d1d" stroke-width="3" opacity="0.6">
        <line x1="35" y1="8" x2="35" y2="80" />
        <line x1="55" y1="8" x2="55" y2="80" />
        <line x1="75" y1="8" x2="75" y2="80" />
        <line x1="95" y1="8" x2="95" y2="80" />
        <line x1="115" y1="8" x2="115" y2="80" stroke="#fca5a5" stroke-width="2.5" opacity="0.8" />
        <line x1="135" y1="8" x2="135" y2="80" />
        <line x1="155" y1="8" x2="155" y2="80" />
        <line x1="175" y1="8" x2="175" y2="80" />
        <line x1="195" y1="8" x2="195" y2="80" />
      </g>
    </g>
  </defs>

  <!-- 1. Exact Yellow Background -->
  <rect width="600" height="900" fill="url(#yellowBg2)" />

  <!-- Shadow Floor -->
  <ellipse cx="300" cy="870" rx="270" ry="24" fill="#5c3b00" opacity="0.65" filter="url(#stackShadow)" />

  <!-- 2. Bottom Left Jar -->
  <g transform="translate(30, 360)" filter="url(#stackShadow)">
    <use href="#miniJar" />
  </g>

  <!-- 3. Bottom Right Jar -->
  <g transform="translate(340, 360)" filter="url(#stackShadow)">
    <use href="#miniJar" />
  </g>

  <!-- 4. Top Centered Jar (Completing the Exact 3-Jar Stack in User Photo) -->
  <g transform="translate(185, 40)" filter="url(#stackShadow)">
    <use href="#miniJar" />
  </g>
</svg>
