<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 950" width="100%" height="100%">
  <defs>
    <!-- Concrete Ground Texture / Color Gradient matching User's 3rd photo -->
    <linearGradient id="concreteFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a8d8e" />
      <stop offset="30%" stop-color="#9ea1a2" />
      <stop offset="70%" stop-color="#7e8182" />
      <stop offset="100%" stop-color="#696b6c" />
    </linearGradient>

    <!-- Concrete Stains & Cracks Pattern -->
    <pattern id="concreteNoise" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none" />
      <circle cx="12" cy="18" r="4" fill="#525455" opacity="0.3" />
      <circle cx="45" cy="40" r="6" fill="#424445" opacity="0.25" />
      <circle cx="30" cy="10" r="3" fill="#b0b3b4" opacity="0.4" />
      <line x1="5" y1="50" x2="25" y2="58" stroke="#484a4b" stroke-width="1" opacity="0.3" />
      <line x1="40" y1="5" x2="55" y2="12" stroke="#484a4b" stroke-width="1" opacity="0.3" />
    </pattern>

    <!-- Single Dead Rat Macro Object -->
    <g id="deadRat">
      <!-- Shadow on concrete -->
      <ellipse cx="0" cy="5" rx="55" ry="16" fill="#2d3032" opacity="0.6" />
      
      <!-- Long Rat Tail extending out -->
      <path d="M -50 0 C -90 -10, -120 15, -150 -5" stroke="#3b3734" stroke-width="3.5" fill="none" stroke-linecap="round" />
      
      <!-- Fur / Body -->
      <ellipse cx="0" cy="0" rx="52" ry="18" fill="#4a423b" />
      <ellipse cx="-5" cy="-2" rx="42" ry="14" fill="#5c524a" />
      <ellipse cx="5" cy="2" rx="35" ry="10" fill="#2e2925" />

      <!-- Head & Snout -->
      <ellipse cx="48" cy="2" rx="18" ry="11" fill="#4a423b" />
      <circle cx="64" cy="3" r="3" fill="#2e2925" />
      
      <!-- Whiskers -->
      <line x1="60" y1="0" x2="75" y2="-6" stroke="#d6d3d1" stroke-width="1" opacity="0.7" />
      <line x1="60" y1="3" x2="78" y2="3" stroke="#d6d3d1" stroke-width="1" opacity="0.7" />
      <line x1="60" y1="6" x2="74" y2="10" stroke="#d6d3d1" stroke-width="1" opacity="0.7" />

      <!-- Ears -->
      <circle cx="36" cy="-8" r="6" fill="#3b3734" />
      <circle cx="36" cy="-8" r="3.5" fill="#f87171" opacity="0.7" />

      <!-- Limbs / Paws (Relaxed / Dead state) -->
      <ellipse cx="-20" cy="16" rx="8" ry="4" fill="#fca5a5" opacity="0.8" />
      <ellipse cx="25" cy="16" rx="8" ry="4" fill="#fca5a5" opacity="0.8" />
      <ellipse cx="-15" cy="-14" rx="7" ry="3.5" fill="#fca5a5" opacity="0.8" />
      <ellipse cx="30" cy="-14" rx="7" ry="3.5" fill="#fca5a5" opacity="0.8" />
    </g>
  </defs>

  <!-- Concrete Pavement Background -->
  <rect width="600" height="950" fill="url(#concreteFloor)" />
  <rect width="600" height="950" fill="url(#concreteNoise)" />

  <!-- Asphalt Expansion Joint Line -->
  <line x1="120" y1="0" x2="180" y2="950" stroke="#484a4b" stroke-width="3" opacity="0.5" />
  <line x1="450" y1="0" x2="480" y2="950" stroke="#3b3d3e" stroke-width="2" opacity="0.4" />

  <!-- Top Extermination Results Banner -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="540" height="50" rx="14" fill="#000000" opacity="0.85" stroke="#facc15" stroke-width="2" />
    <text x="270" y="32" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="18" fill="#facc15" text-anchor="middle" letter-spacing="1.5">
      VERIFIED NIGHT ERADICATION RESULT (20+ RATS)
    </text>
  </g>

  <!-- Vertical Sequence of Exterminated Rodents matching the line in user photo -->
  <g transform="translate(320, 100) rotate(12)">
    <!-- 1 -->
    <g transform="translate(0, 0) scale(0.95)"><use href="#deadRat" /></g>
    <!-- 2 -->
    <g transform="translate(10, 48) scale(0.9)"><use href="#deadRat" /></g>
    <!-- 3 -->
    <g transform="translate(-8, 92) scale(1.05)"><use href="#deadRat" /></g>
    <!-- 4 -->
    <g transform="translate(12, 140) scale(1.15)"><use href="#deadRat" /></g>
    <!-- 5 -->
    <g transform="translate(-5, 192) scale(1.0)"><use href="#deadRat" /></g>
    <!-- 6 -->
    <g transform="translate(8, 240) scale(0.95)"><use href="#deadRat" /></g>
    <!-- 7 -->
    <g transform="translate(-10, 288) scale(0.9)"><use href="#deadRat" /></g>
    <!-- 8 -->
    <g transform="translate(5, 335) scale(1.1)"><use href="#deadRat" /></g>
    <!-- 9 -->
    <g transform="translate(-5, 385) scale(1.0)"><use href="#deadRat" /></g>
    <!-- 10 -->
    <g transform="translate(12, 435) scale(0.95)"><use href="#deadRat" /></g>
    <!-- 11 -->
    <g transform="translate(-8, 482) scale(1.05)"><use href="#deadRat" /></g>
    <!-- 12 -->
    <g transform="translate(6, 530) scale(1.12)"><use href="#deadRat" /></g>
    <!-- 13 -->
    <g transform="translate(-4, 580) scale(0.98)"><use href="#deadRat" /></g>
    <!-- 14 -->
    <g transform="translate(10, 630) scale(1.02)"><use href="#deadRat" /></g>
    <!-- 15 -->
    <g transform="translate(-6, 680) scale(0.92)"><use href="#deadRat" /></g>
    <!-- 16 -->
    <g transform="translate(8, 730) scale(1.08)"><use href="#deadRat" /></g>
  </g>

  <!-- Bottom Killapest Field Stamp -->
  <g transform="translate(30, 875)">
    <rect x="0" y="0" width="540" height="50" rx="14" fill="#000000" opacity="0.85" stroke="#ef4444" stroke-width="2" />
    <text x="270" y="32" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      KILLAPEST FIELD PROOF • ZERO RESISTANCE • 100% KNOCKDOWN
    </text>
  </g>
</svg>
