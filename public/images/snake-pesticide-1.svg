<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgSnakePesticide" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- MagicForce White Bottle Gradient -->
    <linearGradient id="magicBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- DimeForce Dark Translucent Bottle Gradient -->
    <linearGradient id="dimeBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Blue Cap Gradient -->
    <linearGradient id="blueCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- White Cap Gradient -->
    <linearGradient id="whiteCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="bottleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgSnakePesticide)" />

  <!-- Floor table shadow -->
  <ellipse cx="500" cy="540" rx="420" ry="30" fill="#000000" opacity="0.5" />

  <!-- Left: MagicForce Bottle -->
  <g transform="translate(180, 40)" filter="url(#bottleShadow)">
    <!-- Blue Cap -->
    <rect x="70" y="30" width="80" height="40" rx="8" fill="url(#blueCap)" stroke="#0284c7" stroke-width="2" />
    <!-- Cap Ridges -->
    <line x1="85" y1="35" x2="85" y2="65" stroke="#0369a1" stroke-width="2" />
    <line x1="100" y1="35" x2="100" y2="65" stroke="#0369a1" stroke-width="2" />
    <line x1="115" y1="35" x2="115" y2="65" stroke="#0369a1" stroke-width="2" />
    <line x1="130" y1="35" x2="130" y2="65" stroke="#0369a1" stroke-width="2" />
    <line x1="140" y1="35" x2="140" y2="65" stroke="#0369a1" stroke-width="2" />

    <!-- Neck & Shoulder -->
    <path d="M 75,70 L 60,140 C 40,180 30,220 30,260 L 30,470 C 30,490 45,500 70,500 L 150,500 C 175,500 190,490 190,470 L 190,260 C 190,220 180,180 160,140 L 145,70 Z" fill="url(#magicBottle)" stroke="#94a3b8" stroke-width="1.5" />

    <!-- MagicForce Body Label -->
    <rect x="32" y="210" width="156" height="250" rx="6" fill="#f8fafc" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Top Label Banner -->
    <rect x="32" y="210" width="156" height="65" rx="6" fill="#0284c7" />
    <text x="110" y="245" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="24" fill="#facc15" text-anchor="middle" letter-spacing="1">
      Magic
    </text>
    <text x="110" y="268" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      force
    </text>

    <!-- Formula Subtext -->
    <text x="110" y="295" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#0369a1" text-anchor="middle">
      BROAD SPECTRUM
    </text>
    <text x="110" y="310" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" fill="#64748b" text-anchor="middle">
      Systemic &amp; Contact Emulsion
    </text>

    <!-- Pictograms Circles -->
    <circle cx="65" cy="350" r="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="65" y="356" font-size="16" text-anchor="middle">🐍</text>
    
    <circle cx="110" cy="350" r="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="110" y="356" font-size="16" text-anchor="middle">🦎</text>

    <circle cx="155" cy="350" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="155" y="356" font-size="16" text-anchor="middle">🦂</text>

    <!-- Yellow / Red warning band at bottom -->
    <rect x="32" y="420" width="156" height="40" fill="#facc15" />
    <rect x="32" y="445" width="156" height="15" fill="#dc2626" />
    <text x="110" y="438" font-family="'Outfit', sans-serif" font-weight="900" font-size="11" fill="#000000" text-anchor="middle">
      SNAKE &amp; REPTILE BARRIER
    </text>
  </g>

  <!-- Right: DimeForce Bottle -->
  <g transform="translate(420, 40)" filter="url(#bottleShadow)">
    <!-- White Cap -->
    <rect x="70" y="30" width="80" height="40" rx="8" fill="url(#whiteCap)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Cap Ridges -->
    <line x1="85" y1="35" x2="85" y2="65" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="100" y1="35" x2="100" y2="65" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="115" y1="35" x2="115" y2="65" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="130" y1="35" x2="130" y2="65" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="140" y1="35" x2="140" y2="65" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Neck & Shoulder -->
    <path d="M 75,70 L 60,140 C 40,180 30,220 30,260 L 30,470 C 30,490 45,500 70,500 L 150,500 C 175,500 190,490 190,470 L 190,260 C 190,220 180,180 160,140 L 145,70 Z" fill="url(#dimeBottle)" stroke="#475569" stroke-width="1.5" />

    <!-- DimeForce Body Label -->
    <rect x="32" y="210" width="156" height="250" rx="6" fill="#1e293b" stroke="#16a34a" stroke-width="2" />
    
    <!-- Top Green Badge -->
    <rect x="42" y="222" width="136" height="45" rx="8" fill="#16a34a" />
    <text x="110" y="254" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      DimeForce
    </text>

    <!-- Subtitle text -->
    <text x="110" y="285" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="middle">
      Dimethoate + Cypermethrin
    </text>
    <text x="110" y="300" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#4ade80" text-anchor="middle">
      HIGH POTENCY EMULSION
    </text>

    <!-- Central Icons / Target Matrix -->
    <rect x="42" y="315" width="136" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="110" y="338" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#facc15" text-anchor="middle">
      DEADLY ON CONTACT
    </text>
    <text x="110" y="358" font-family="'Outfit', sans-serif" font-weight="600" font-size="10" fill="#e2e8f0" text-anchor="middle">
      Cobras • Vipers • Pythons
    </text>
    <text x="110" y="375" font-family="'Outfit', sans-serif" font-weight="600" font-size="10" fill="#e2e8f0" text-anchor="middle">
      Wall Geckos • Scorpions
    </text>
    <text x="110" y="395" font-family="'Outfit', sans-serif" font-weight="700" font-size="10" fill="#38bdf8" text-anchor="middle">
      100% Compound Clearance
    </text>

    <!-- Bottom Yellow Safety Banner -->
    <rect x="32" y="420" width="156" height="40" fill="#facc15" />
    <text x="110" y="444" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">
      1 LITRE CONCENTRATE
    </text>
  </g>

  <!-- Right: Technical Specification Panel -->
  <g transform="translate(670, 70)" font-family="'Outfit', sans-serif">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="34" rx="8" fill="#dc2626" />
    <text x="110" y="23" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      DUAL-ACTION FORMULA
    </text>

    <text x="0" y="75" font-weight="900" font-size="26" fill="#ffffff">
      SNAKE PESTICIDE
    </text>
    <text x="0" y="105" font-weight="800" font-size="18" fill="#facc15">
      DimeForce &amp; MagicForce
    </text>

    <!-- Specs List -->
    <g transform="translate(0, 135)">
      <!-- Item 1 -->
      <circle cx="12" cy="12" r="10" fill="#16a34a" />
      <text x="12" y="16" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="32" y="16" font-size="14" font-weight="700" fill="#ffffff">Instant Neurological Knockdown</text>

      <!-- Item 2 -->
      <g transform="translate(0, 45)">
        <circle cx="12" cy="12" r="10" fill="#16a34a" />
        <text x="12" y="16" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
        <text x="32" y="16" font-size="14" font-weight="700" fill="#ffffff">6-Month Perimeter Repellent Barrier</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 90)">
        <circle cx="12" cy="12" r="10" fill="#16a34a" />
        <text x="12" y="16" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
        <text x="32" y="16" font-size="14" font-weight="700" fill="#ffffff">Effective for Snakes, Geckos &amp; Scorpions</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 135)">
        <circle cx="12" cy="12" r="10" fill="#16a34a" />
        <text x="12" y="16" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
        <text x="32" y="16" font-size="14" font-weight="700" fill="#ffffff">Commercial &amp; Residential Grade</text>
      </g>
    </g>

    <!-- Price Tag Banner -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="290" height="60" rx="14" fill="#0f172a" stroke="#facc15" stroke-width="2" />
      <text x="20" y="38" font-weight="900" font-size="28" fill="#facc15">
        ₦15,500.00
      </text>
      <text x="190" y="38" font-weight="700" font-size="14" fill="#94a3b8">
        / 1L Bottle
      </text>
    </g>
  </g>
</svg>
