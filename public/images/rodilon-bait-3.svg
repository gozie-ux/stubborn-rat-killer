<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgOutdoor" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Bait Station Plastic Box -->
    <linearGradient id="stationGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Alert -->
    <filter id="alertGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#facc15" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgOutdoor)" />

  <!-- Concrete Floor & Wall Corner Base -->
  <polygon points="0,380 1000,380 1000,600 0,600" fill="#182234" />
  <line x1="0" y1="380" x2="1000" y2="380" stroke="#475569" stroke-width="3" />

  <!-- Left: Tamper-Resistant Rodent Bait Station Cross-Section showing Blue Blocks -->
  <g transform="translate(60, 140)">
    <!-- Bait Station Outer Box Shell -->
    <rect x="20" y="80" width="400" height="230" rx="18" fill="url(#stationGrad)" stroke="#64748b" stroke-width="3" />
    
    <!-- Secure Entry Hole for Rats/Mice -->
    <circle cx="60" cy="230" r="32" fill="#020617" stroke="#38bdf8" stroke-width="2" />
    <circle cx="380" cy="230" r="32" fill="#020617" stroke="#38bdf8" stroke-width="2" />

    <!-- Internal Steel Rod -->
    <line x1="100" y1="180" x2="340" y2="180" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />

    <!-- 4 Blue Rodilon Wax Blocks mounted securely on steel rod -->
    <!-- Block 1 -->
    <rect x="130" y="145" width="40" height="70" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <line x1="140" y1="150" x2="140" y2="210" stroke="#082f49" stroke-width="2" />
    <line x1="160" y1="150" x2="160" y2="210" stroke="#082f49" stroke-width="2" />

    <!-- Block 2 -->
    <rect x="180" y="145" width="40" height="70" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <line x1="190" y1="150" x2="190" y2="210" stroke="#082f49" stroke-width="2" />
    <line x1="210" y1="150" x2="210" y2="210" stroke="#082f49" stroke-width="2" />

    <!-- Block 3 -->
    <rect x="230" y="145" width="40" height="70" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <line x1="240" y1="150" x2="240" y2="210" stroke="#082f49" stroke-width="2" />
    <line x1="260" y1="150" x2="260" y2="210" stroke="#082f49" stroke-width="2" />

    <!-- Block 4 -->
    <rect x="280" y="145" width="40" height="70" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <line x1="290" y1="150" x2="290" y2="210" stroke="#082f49" stroke-width="2" />
    <line x1="310" y1="150" x2="310" y2="210" stroke="#082f49" stroke-width="2" />

    <!-- Station Label -->
    <rect x="135" y="95" width="170" height="28" rx="6" fill="#facc15" />
    <text x="145" y="114" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#000000">
      KILLAPEST SECURE STATION
    </text>

    <!-- Bottom Legend -->
    <text x="30" y="345" font-family="'Outfit', sans-serif" font-weight="800" font-size="15" fill="#94a3b8">
      Weatherproof • Mold-Resistant • Indoors &amp; Outdoors
    </text>
  </g>

  <!-- Right Application Guide -->
  <g transform="translate(520, 90)">
    <rect x="0" y="0" width="430" height="420" rx="18" fill="#0b1329" stroke="#334155" stroke-width="2" />
    
    <g transform="translate(25, 30)" font-family="'Outfit', sans-serif">
      <text x="0" y="20" font-weight="900" font-size="24" fill="#ffffff">
        Professional Deployment Guide
      </text>
      <text x="0" y="45" font-weight="600" font-size="14" fill="#38bdf8">
        KillAPest Resources Rodilon Rodenticide Protocol
      </text>

      <line x1="0" y1="65" x2="380" y2="65" stroke="#1e293b" stroke-width="2" />

      <!-- Step 1 -->
      <g transform="translate(0, 85)">
        <rect x="0" y="0" width="30" height="30" rx="8" fill="#16a34a" />
        <text x="10" y="21" font-weight="900" font-size="16" fill="#ffffff">A</text>
        <text x="45" y="14" font-weight="800" font-size="15" fill="#ffffff">Perimeter &amp; Runway Setup</text>
        <text x="45" y="32" font-weight="500" font-size="13" fill="#94a3b8">Place 1-2 blocks every 5-10m along baseboards</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="30" height="30" rx="8" fill="#16a34a" />
        <text x="10" y="21" font-weight="900" font-size="16" fill="#ffffff">B</text>
        <text x="45" y="14" font-weight="800" font-size="15" fill="#ffffff">Warehouse &amp; Ceiling Runways</text>
        <text x="45" y="32" font-weight="500" font-size="13" fill="#94a3b8">Secure in bait boxes or wire rods near rodent nests</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 215)">
        <rect x="0" y="0" width="30" height="30" rx="8" fill="#16a34a" />
        <text x="10" y="21" font-weight="900" font-size="16" fill="#ffffff">C</text>
        <text x="45" y="14" font-weight="800" font-size="15" fill="#ffffff">Replenish Until Feeding Stops</text>
        <text x="45" y="32" font-weight="500" font-size="13" fill="#94a3b8">Inspect daily; total colony demise in 3-5 days</text>
      </g>

      <!-- Hotline -->
      <g transform="translate(0, 285)">
        <rect x="0" y="0" width="380" height="48" rx="12" fill="#1e293b" stroke="#facc15" stroke-width="1.5" />
        <text x="15" y="30" font-weight="800" font-size="14" fill="#facc15">
          WhatsApp Dispatch: +234 8089854753
        </text>
      </g>
    </g>
  </g>
</svg>
