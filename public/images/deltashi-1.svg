<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgDeltashi" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a1b12" />
      <stop offset="60%" stop-color="#140c07" />
      <stop offset="100%" stop-color="#050302" />
    </radialGradient>

    <!-- Amber / Brown Liquid in Transparent PET Bottle -->
    <linearGradient id="amberLiquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="25%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Translucent Plastic Sheen -->
    <linearGradient id="petGlossGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- Measuring Cap Bronze Gradient -->
    <linearGradient id="bronzeCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="35%" stop-color="#b45309" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <filter id="bottleShadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgDeltashi)" />

  <!-- Studio Platform Glow -->
  <ellipse cx="500" cy="530" rx="360" ry="35" fill="#f59e0b" opacity="0.15" />
  <ellipse cx="500" cy="530" rx="260" ry="22" fill="#000000" opacity="0.75" />

  <!-- MAIN DELTASHI 1 LITRE AMBER BOTTLE -->
  <g transform="translate(370, 30)" filter="url(#bottleShadow3D)">
    <!-- BOTTLE BASE & AMBER LIQUID -->
    
    <!-- Transparent Bottle Body -->
    <rect x="15" y="140" width="230" height="360" rx="18" fill="url(#amberLiquidGrad)" stroke="#78350f" stroke-width="1.5" />
    <rect x="15" y="140" width="230" height="360" rx="18" fill="url(#petGlossGrad)" />

    <!-- Rounded Shoulder & Cone Taper -->
    <path d="M 15,150 C 15,100 65,45 130,40 C 195,45 245,100 245,150 Z" fill="url(#amberLiquidGrad)" stroke="#78350f" stroke-width="1.5" />
    <path d="M 15,150 C 15,100 65,45 130,40 C 195,45 245,100 245,150 Z" fill="url(#petGlossGrad)" />

    <!-- Measuring Dispenser Overcap (Bronze/Amber Plastic) -->
    <path d="M 65,90 L 75,20 C 75,12 185,12 185,20 L 195,90 Z" fill="url(#bronzeCapGrad)" stroke="#451a03" stroke-width="1.5" />
    <!-- Measuring Lines on Cap -->
    <line x1="90" y1="40" x2="170" y2="40" stroke="#fef3c7" stroke-width="1" stroke-dasharray="6 3" opacity="0.7" />
    <line x1="85" y1="60" x2="175" y2="60" stroke="#fef3c7" stroke-width="1" stroke-dasharray="6 3" opacity="0.7" />

    <!-- Shrink Wrap Clear Film Effect -->
    <rect x="63" y="15" width="134" height="85" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 2" />

    <!-- MAIN PRODUCT LABEL -->
    <g transform="translate(18, 145)">
      <!-- Label Background (Cream / Wheat Textured Card) -->
      <rect x="0" y="0" width="224" height="335" rx="8" fill="#ffedd5" stroke="#fed7aa" stroke-width="1" />

      <!-- Top Scalloped White/Green Header Banner -->
      <rect x="0" y="0" width="224" height="75" fill="#ffffff" />
      
      <!-- ROYAGRIC Emblem Logo -->
      <g transform="translate(112, 22)">
        <ellipse cx="0" cy="0" rx="26" ry="16" fill="#15803d" stroke="#166534" stroke-width="1" />
        <ellipse cx="0" cy="0" rx="20" ry="12" fill="#dcfce7" />
        <text x="0" y="5" font-family="'Impact', 'Outfit', sans-serif" font-weight="900" font-size="14" fill="#15803d" text-anchor="middle">
          R
        </text>
        <text x="0" y="19" font-family="'Outfit', sans-serif" font-weight="800" font-size="6" fill="#15803d" text-anchor="middle">
          ...together we grow
        </text>
      </g>

      <!-- BRAND NAME "Deltashi" -->
      <g transform="translate(112, 60)">
        <text x="0" y="0" font-family="'Impact', 'Outfit', sans-serif" font-weight="900" font-size="28" fill="#1e3a8a" letter-spacing="1" text-anchor="middle">
          Del<tspan fill="#dc2626">tashi</tspan>
        </text>
      </g>

      <!-- Active Ingredient Red Pill Badge (12.5g/L High Strength!) -->
      <g transform="translate(112, 76)">
        <rect x="-85" y="-10" width="170" height="18" rx="9" fill="#dc2626" />
        <text x="0" y="3" font-family="'Outfit', sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
          Deltamethrin 12.5g/L EC
        </text>
      </g>

      <!-- 8 TARGET PESTS PHOTO GRID (Iconic 2x4 Matrix) -->
      <g transform="translate(12, 92)">
        <!-- Grid Background -->
        <rect x="0" y="0" width="200" height="195" rx="6" fill="#fed7aa" />

        <!-- Box 1: Mosquito (Top Left) -->
        <g transform="translate(4, 4)">
          <rect x="0" y="0" width="44" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
          <circle cx="22" cy="18" r="8" fill="#334155" />
          <text x="22" y="37" font-family="'Outfit', sans-serif" font-weight="800" font-size="6" fill="#0f172a" text-anchor="middle">MOSQUITO</text>
        </g>

        <!-- Box 2: Cricket (Top Mid-Left) -->
        <g transform="translate(52, 4)">
          <rect x="0" y="0" width="44" height="42" rx="4" fill="#15803d" stroke="#166534" stroke-width="0.8" />
          <ellipse cx="22" cy="18" rx="10" ry="6" fill="#84cc16" />
          <text x="22" y="37" font-family="'Outfit', sans-serif" font-weight="800" font-size="6" fill="#ffffff" text-anchor="middle">CRICKET</text>
        </g>

        <!-- Box 3: Beetle / Weevil (Top Mid-Right) -->
        <g transform="translate(100, 4)">
          <rect x="0" y="0" width="44" height="42" rx="4" fill="#78350f" stroke="#451a03" stroke-width="0.8" />
          <ellipse cx="22" cy="18" rx="8" ry="10" fill="#d97706" />
          <text x="22" y="37" font-family="'Outfit', sans-serif" font-weight="800" font-size="6" fill="#ffffff" text-anchor="middle">BEETLE</text>
        </g>

        <!-- Box 4: Fly / Aphid (Top Right) -->
        <g transform="translate(148, 4)">
          <rect x="0" y="0" width="48" height="42" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="0.8" />
          <circle cx="24" cy="18" r="7" fill="#e0f2fe" />
          <text x="24" y="37" font-family="'Outfit', sans-serif" font-weight="800" font-size="6" fill="#ffffff" text-anchor="middle">APHIDS</text>
        </g>

        <!-- Box 5: Caterpillar / Armyworm (Row 2 Left) -->
        <g transform="translate(4, 50)">
          <rect x="0" y="0" width="92" height="42" rx="4" fill="#166534" stroke="#14532d" stroke-width="0.8" />
          <path d="M 15,22 Q 25,10 45,22 Q 65,10 75,22" stroke="#facc15" stroke-width="5" stroke-linecap="round" fill="none" />
          <text x="46" y="37" font-family="'Outfit', sans-serif" font-weight="800" font-size="6" fill="#ffffff" text-anchor="middle">ARMYWORM / CATERPILLAR</text>
        </g>

        <!-- Box 6: Striped Caterpillar (Row 2 Right) -->
        <g transform="translate(100, 50)">
          <rect x="0" y="0" width="96" height="42" rx="4" fill="#15803d" stroke="#166534" stroke-width="0.8" />
          <ellipse cx="48" cy="20" rx="30" ry="7" fill="#84cc16" />
          <text x="48" y="37" font-family="'Outfit', sans-serif" font-weight="800" font-size="6" fill="#ffffff" text-anchor="middle">LEPIDOPTERA</text>
        </g>

        <!-- Box 7: Cockroach (Row 3 Left) -->
        <g transform="translate(4, 96)">
          <rect x="0" y="0" width="92" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
          <ellipse cx="46" cy="18" rx="14" ry="8" fill="#991b1b" />
          <text x="46" y="38" font-family="'Outfit', sans-serif" font-weight="800" font-size="6.5" fill="#7f1d1d" text-anchor="middle">COCKROACH</text>
        </g>

        <!-- Box 8: Termite / Woodborer (Row 3 Right) -->
        <g transform="translate(100, 96)">
          <rect x="0" y="0" width="96" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
          <ellipse cx="48" cy="18" rx="16" ry="7" fill="#c2410c" />
          <text x="48" y="38" font-family="'Outfit', sans-serif" font-weight="800" font-size="6.5" fill="#9a3412" text-anchor="middle">SUBTERRANEAN TERMITE</text>
        </g>

        <!-- Box 9: Locusts & Grasshoppers (Row 4 Span) -->
        <g transform="translate(4, 144)">
          <rect x="0" y="0" width="192" height="46" rx="4" fill="#166534" stroke="#14532d" stroke-width="0.8" />
          <ellipse cx="96" cy="20" rx="40" ry="9" fill="#eab308" />
          <text x="96" y="38" font-family="'Outfit', sans-serif" font-weight="800" font-size="7" fill="#ffffff" text-anchor="middle">LOCUSTS, GRASSHOPPERS &amp; THRIPS</text>
        </g>
      </g>

      <!-- Bottom Red 1 Ltr & Warning Banner -->
      <g transform="translate(0, 295)">
        <rect x="0" y="0" width="224" height="40" rx="4" fill="#7c2d12" />
        <rect x="90" y="4" width="44" height="20" rx="4" fill="#dc2626" />
        <text x="112" y="18" font-family="'Impact', 'Outfit', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">
          1 Ltr
        </text>
        <text x="112" y="33" font-family="'Outfit', sans-serif" font-weight="800" font-size="6.5" fill="#fef08a" text-anchor="middle">
          CAUTION: KEEP OUT OF REACH OF CHILDREN
        </text>
      </g>
    </g>
  </g>

  <!-- Left Highlights Card (Concentration Advantage) -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="280" height="220" rx="16" fill="#0f172a" opacity="0.95" stroke="#f59e0b" stroke-width="2" />
    <text x="20" y="36" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#f59e0b">
      DELTASHI 12.5g/L EC
    </text>
    <text x="20" y="58" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#fde68a">
      10X Concentrated Active Ingredient Formula
    </text>

    <line x1="20" y1="72" x2="260" y2="72" stroke="#334155" stroke-width="1" />

    <text x="20" y="96" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#4ade80">
      ✓ Kills Termites, Roaches &amp; Armyworms
    </text>
    <text x="20" y="120" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#ffffff">
      ✓ Fast Contact &amp; Ingestion Knockdown
    </text>
    <text x="20" y="144" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#38bdf8">
      ✓ Multi-Month Residual Barrier
    </text>
    <text x="20" y="168" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#facc15">
      ✓ 1 Litre Amber Shield Bottle + Cap
    </text>
    <text x="20" y="192" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#f87171">
      ✓ Toxicity Class: II (High Potency)
    </text>
  </g>

  <!-- Right Side Application Card -->
  <g transform="translate(670, 130)">
    <rect x="0" y="0" width="280" height="220" rx="16" fill="#0f172a" opacity="0.95" stroke="#ef4444" stroke-width="2" />
    <text x="20" y="36" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#ef4444">
      HIGH STRENGTH DILUTION
    </text>
    <text x="20" y="58" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#fca5a5">
      Economic Multi-Acre Coverage
    </text>

    <line x1="20" y1="72" x2="260" y2="72" stroke="#334155" stroke-width="1" />

    <text x="20" y="98" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#ffffff">
      • 15ml – 30ml
    </text>
    <text x="32" y="118" font-family="'Outfit', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">
      per 15L Knapsack Sprayer
    </text>

    <text x="20" y="148" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#38bdf8">
      • 30ml – 50ml
    </text>
    <text x="32" y="168" font-family="'Outfit', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">
      for Termite Trenching &amp; Wood Drench
    </text>

    <text x="20" y="196" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#facc15">
      • Re-Entry Interval: 24 Hours
    </text>
  </g>
</svg>
