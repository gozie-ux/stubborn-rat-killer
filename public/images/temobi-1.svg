<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgTemobi" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a0d0d" />
      <stop offset="60%" stop-color="#140606" />
      <stop offset="100%" stop-color="#050202" />
    </radialGradient>

    <!-- Vibrant Italian Red Box Gradient -->
    <linearGradient id="temobiRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="80%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Tube Metallic Red Sheen Gradient -->
    <linearGradient id="tubeRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="30%" stop-color="#dc2626" />
      <stop offset="70%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <filter id="temobiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgTemobi)" />

  <!-- Studio Floor Glow -->
  <ellipse cx="500" cy="520" rx="380" ry="40" fill="#ef4444" opacity="0.15" />
  <ellipse cx="500" cy="520" rx="280" ry="24" fill="#000000" opacity="0.75" />

  <!-- PRODUCT SET GROUP (Box + Squeezable Tube) -->
  <g transform="translate(140, 90)" filter="url(#temobiShadow)">
    
    <!-- 1. KOLLANT TEMOBI RECTANGULAR BOX (Behind Tube) -->
    <g transform="translate(40, 180)">
      <!-- Main Front Box Face -->
      <rect x="0" y="0" width="640" height="200" rx="8" fill="url(#temobiRedGrad)" stroke="#ffffff" stroke-width="3" />
      <rect x="12" y="12" width="616" height="176" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5" />

      <!-- Left Side Kollant Yellow Logo -->
      <g transform="translate(35, 40)">
        <rect x="0" y="0" width="100" height="90" rx="4" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
        <path d="M 20,15 L 45,15 L 45,75 L 20,75 Z M 45,45 L 75,15 L 88,15 L 58,45 L 90,75 L 75,75 Z" fill="#dc2626" />
        <text x="50" y="112" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">
          KOLLANT
        </text>
      </g>

      <!-- Central TEMOBI Brand Typography -->
      <g transform="translate(180, 50)">
        <!-- Italian Rat Silhouette Running -->
        <g transform="translate(80, 10) scale(0.7)">
          <ellipse cx="40" cy="20" rx="30" ry="12" fill="#0f172a" />
          <circle cx="15" cy="16" r="8" fill="#0f172a" />
          <path d="M 65,18 Q 95,5 110,30" stroke="#0f172a" stroke-width="3" fill="none" />
          <circle cx="12" cy="14" r="2" fill="#ef4444" />
        </g>

        <text x="140" y="70" font-family="'Impact', 'Outfit', sans-serif" font-weight="900" font-size="64" fill="#facc15" letter-spacing="2" font-style="italic">
          TEMO<tspan fill="#ffffff">Bi</tspan>
        </text>
      </g>

      <!-- Multilingual Description (Italian, English, French, Spanish) -->
      <g transform="translate(380, 45)">
        <text x="0" y="18" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#fef08a">PER TOPI E RATTI</text>
        <text x="0" y="34" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#ffffff">FOR TRAPPING RATS</text>
        <text x="0" y="50" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#fef08a">CONTRE LES RATS</text>
        <text x="0" y="66" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#ffffff">PARA RATAS</text>
      </g>

      <!-- Bottom White Banner Details -->
      <g transform="translate(25, 145)">
        <text x="160" y="24" font-family="'Outfit', sans-serif" font-weight="800" font-size="10" fill="#fef08a">
          COLA NÃO VENENOSA PARA APANHAR: RATOS, FORMIGAS, BARATAS, INSECTOS, ETC.
        </text>
        <!-- 135g Weight Badge -->
        <rect x="520" y="4" width="70" height="26" rx="4" fill="#facc15" />
        <text x="555" y="22" font-family="'Impact', 'Outfit', sans-serif" font-weight="900" font-size="14" fill="#7f1d1d" text-anchor="middle">
          135 g
        </text>
      </g>
    </g>

    <!-- 2. ALUMINIUM CRIMPED SQUEEZE TUBE (Resting on Top / Angled) -->
    <g transform="translate(90, 40) rotate(-6)">
      <!-- Tube Body -->
      <path d="M 70,25 L 520,10 L 530,95 L 70,80 Z" fill="url(#tubeRedGrad)" stroke="#ffffff" stroke-width="1.5" />
      
      <!-- Crimped End (Right) -->
      <rect x="515" y="10" width="22" height="85" fill="#ca8a04" stroke="#eab308" stroke-width="1" />
      <line x1="522" y1="10" x2="522" y2="95" stroke="#78350f" stroke-width="1" />
      <line x1="528" y1="10" x2="528" y2="95" stroke="#78350f" stroke-width="1" />

      <!-- Neck & Red Plastic Screw Nozzle Cap (Left) -->
      <polygon points="70,35 45,40 45,65 70,70" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
      <rect x="15" y="38" width="30" height="29" rx="3" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" />
      <!-- Ribs on Cap -->
      <line x1="22" y1="38" x2="22" y2="67" stroke="#ef4444" stroke-width="1.5" />
      <line x1="30" y1="38" x2="30" y2="67" stroke="#ef4444" stroke-width="1.5" />
      <line x1="38" y1="38" x2="38" y2="67" stroke="#ef4444" stroke-width="1.5" />

      <!-- Logo on Tube -->
      <text x="210" y="62" font-family="'Impact', 'Outfit', sans-serif" font-weight="900" font-size="38" fill="#facc15" letter-spacing="1" font-style="italic">
        TEMO<tspan fill="#ffffff">Bi</tspan>
      </text>
      
      <text x="350" y="42" font-family="'Outfit', sans-serif" font-weight="800" font-size="9" fill="#fef08a">PER TOPI E RATTI</text>
      <text x="350" y="54" font-family="'Outfit', sans-serif" font-weight="800" font-size="9" fill="#ffffff">FOR TRAPPING RATS</text>
      <text x="350" y="66" font-family="'Outfit', sans-serif" font-weight="800" font-size="9" fill="#fef08a">CONTRE LES RATS</text>
      
      <text x="210" y="78" font-family="'Outfit', sans-serif" font-weight="900" font-size="8" fill="#ffffff">
        NON-POISONOUS ADHESIVE GLUE • 135g
      </text>
    </g>
  </g>

  <!-- Left Side Badges / Attributes -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="260" height="46" rx="12" fill="#000000" opacity="0.85" stroke="#ef4444" stroke-width="1.5" />
    <text x="18" y="28" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" fill="#f87171">
      🇮🇹 KOLLANT TEMOBI (ITALY)
    </text>
  </g>

  <g transform="translate(710, 40)">
    <rect x="0" y="0" width="250" height="46" rx="12" fill="#000000" opacity="0.85" stroke="#22c55e" stroke-width="1.5" />
    <text x="18" y="28" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" fill="#4ade80">
      🌿 100% NON-POISONOUS
    </text>
  </g>
</svg>
