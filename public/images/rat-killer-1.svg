<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <!-- Solid Warm Studio Yellow Background Matching Uploaded Photo -->
    <radialGradient id="yellowBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#f8c818" />
      <stop offset="60%" stop-color="#e2a507" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <!-- Red Ribbed Cap Gradient -->
    <linearGradient id="redCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881313" />
      <stop offset="15%" stop-color="#b91c1c" />
      <stop offset="35%" stop-color="#dc2626" />
      <stop offset="55%" stop-color="#ef4444" />
      <stop offset="75%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Plastic Jar Specular Reflection -->
    <linearGradient id="jarGlassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="12%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="88%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>

    <!-- Rat Bait Granules Pattern (Brown/Grey/Black cereal mix) -->
    <pattern id="baitGranulesMat" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#44403c" />
      <circle cx="4" cy="4" r="2.2" fill="#78716c" />
      <circle cx="12" cy="3" r="1.8" fill="#a8a29e" />
      <circle cx="16" cy="9" r="2.5" fill="#292524" />
      <circle cx="7" cy="13" r="1.9" fill="#d6d3d1" />
      <circle cx="14" cy="16" r="2.2" fill="#1c1917" />
      <circle cx="3" cy="17" r="1.5" fill="#57534e" />
      <circle cx="9" cy="8" r="1.4" fill="#e7e5e4" />
    </pattern>

    <filter id="photoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="22" flood-color="#3f2700" flood-opacity="0.75" />
    </filter>

    <filter id="labelGloss">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Exact Yellow Background -->
  <rect width="600" height="900" fill="url(#yellowBg)" />

  <!-- Shadow under Jar -->
  <ellipse cx="300" cy="830" rx="190" ry="28" fill="#5c3b00" opacity="0.65" filter="url(#photoShadow)" />

  <!-- 2. The Transparent Plastic Jar with Granular Bait -->
  <g transform="translate(0, 20)" filter="url(#photoShadow)">
    
    <!-- Outer Plastic Bottle Shell -->
    <rect x="145" y="195" width="310" height="610" rx="45" fill="url(#baitGranulesMat)" stroke="#44403c" stroke-width="2" />

    <!-- Jar Shoulder Indent -->
    <path d="M 145 220 Q 155 180 185 170 L 415 170 Q 445 180 455 220 Z" fill="#292524" opacity="0.4" />

    <!-- 3. Central Red Product Label -->
    <g filter="url(#labelGloss)">
      <!-- Red Shield / Label Body -->
      <path d="M 165 285 Q 300 300 435 285 L 435 710 Q 300 735 165 710 Z" fill="#d91b1b" stroke="#ffffff" stroke-width="3" />

      <!-- STUBBORN Arched Text at Top -->
      <text x="300" y="380" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="56" fill="#ffffff" stroke="#111111" stroke-width="3" text-anchor="middle" letter-spacing="1">
        STUBBORN
      </text>

      <!-- Yellow Lightning Bolts -->
      <!-- Left lightning bolt pointing in -->
      <polygon points="180,315 285,485 240,490 295,570 210,480 255,475" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
      
      <!-- Right lightning bolt pointing in -->
      <polygon points="420,315 315,485 360,490 305,570 390,480 345,475" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />

      <!-- Center Yellow Oval Frame -->
      <ellipse cx="300" cy="540" rx="80" ry="44" fill="#fef08a" stroke="#ca8a04" stroke-width="2.5" />

      <!-- Two Rats in Oval (Mom rat + baby rat) -->
      <g transform="translate(255, 508)">
        <!-- Big Rat (Right) -->
        <g transform="translate(45, 2)">
          <!-- Tail -->
          <path d="M 5 28 Q -15 35 -30 30" stroke="#1c1917" stroke-width="3.5" fill="none" stroke-linecap="round" />
          <!-- Body -->
          <ellipse cx="28" cy="24" rx="26" ry="19" fill="#1c1917" />
          <!-- Fur Highlights -->
          <ellipse cx="24" cy="20" rx="20" ry="13" fill="#44403c" />
          <!-- Head -->
          <ellipse cx="48" cy="20" rx="14" ry="10" fill="#1c1917" />
          <!-- Snout -->
          <circle cx="59" cy="20" r="3" fill="#ef4444" />
          <!-- Whiskers -->
          <line x1="56" y1="18" x2="68" y2="15" stroke="#ffffff" stroke-width="1" />
          <line x1="56" y1="22" x2="68" y2="25" stroke="#ffffff" stroke-width="1" />
          <!-- Ears -->
          <circle cx="38" cy="10" r="7" fill="#292524" />
          <circle cx="38" cy="10" r="4.5" fill="#f87171" />
          <!-- Eyes with glint -->
          <circle cx="48" cy="16" r="3" fill="#000000" />
          <circle cx="49" cy="15" r="1" fill="#ffffff" />
          <!-- Paws -->
          <ellipse cx="20" cy="38" rx="6" ry="3" fill="#fca5a5" />
          <ellipse cx="42" cy="38" rx="6" ry="3" fill="#fca5a5" />
        </g>

        <!-- Small Baby Rat (Left) -->
        <g transform="translate(0, 14)">
          <!-- Tail -->
          <path d="M 0 16 Q -12 20 -20 18" stroke="#1c1917" stroke-width="2" fill="none" stroke-linecap="round" />
          <!-- Body -->
          <ellipse cx="14" cy="14" rx="13" ry="10" fill="#1c1917" />
          <!-- Head -->
          <ellipse cx="24" cy="11" rx="8" ry="6" fill="#1c1917" />
          <!-- Snout -->
          <circle cx="30" cy="11" r="2" fill="#ef4444" />
          <!-- Ear -->
          <circle cx="19" cy="5" r="4.5" fill="#292524" />
          <circle cx="19" cy="5" r="2.5" fill="#f87171" />
          <!-- Eye -->
          <circle cx="24" cy="9" r="1.8" fill="#ffffff" />
        </g>
      </g>

      <!-- Bottom Black Banner with "RAT KILLER" -->
      <path d="M 180 670 Q 300 690 420 670 L 415 765 Q 300 780 185 765 Z" fill="#0a0a0a" stroke="#ffffff" stroke-width="2" />
      <text x="300" y="730" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">
        RAT
      </text>
      <text x="300" y="760" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">
        KILLER
      </text>

      <!-- Right White Vertical Call Strip -->
      <g transform="translate(400, 390)">
        <rect x="0" y="0" width="26" height="230" rx="13" fill="#ffffff" stroke="#e5e5e5" stroke-width="1" />
        <!-- Phone Icon -->
        <circle cx="13" cy="16" r="8" fill="#d91b1b" />
        <path d="M 9 13 C 9 18, 11 20, 16 20" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
        <!-- Rotated Vertical Text -->
        <text transform="translate(18, 215) rotate(-90)" font-family="'Arial Black', sans-serif" font-weight="900" font-size="11" fill="#d91b1b" letter-spacing="1">
          09021991896
        </text>
        <text transform="translate(9, 215) rotate(-90)" font-family="'Arial', sans-serif" font-weight="700" font-size="7.5" fill="#111111" letter-spacing="0.5">
          KILLAPEST RESOURCES
        </text>
      </g>
    </g>

    <!-- Plastic Jar Gloss & Edge Highlights -->
    <rect x="145" y="195" width="310" height="610" rx="45" fill="url(#jarGlassReflection)" pointer-events="none" />
    <line x1="165" y1="215" x2="165" y2="780" stroke="#ffffff" stroke-width="4" opacity="0.4" stroke-linecap="round" />

    <!-- 4. The Deep Red Ribbed Cap -->
    <!-- Cap Neck / Ring -->
    <rect x="175" y="145" width="250" height="20" rx="4" fill="#5c0d0d" />

    <!-- Main Ribbed Cap Body -->
    <rect x="160" y="25" width="280" height="125" rx="12" fill="url(#redCapGrad)" stroke="#5c0d0d" stroke-width="2" />
    
    <!-- Cap Vertical Ribs -->
    <g stroke="#7f1d1d" stroke-width="4" opacity="0.6">
      <line x1="180" y1="35" x2="180" y2="140" />
      <line x1="200" y1="35" x2="200" y2="140" />
      <line x1="220" y1="35" x2="220" y2="140" />
      <line x1="240" y1="35" x2="240" y2="140" />
      <line x1="260" y1="35" x2="260" y2="140" />
      <line x1="280" y1="35" x2="280" y2="140" />
      <line x1="300" y1="35" x2="300" y2="140" stroke="#fca5a5" stroke-width="3" opacity="0.8" />
      <line x1="320" y1="35" x2="320" y2="140" />
      <line x1="340" y1="35" x2="340" y2="140" />
      <line x1="360" y1="35" x2="360" y2="140" />
      <line x1="380" y1="35" x2="380" y2="140" />
      <line x1="400" y1="35" x2="400" y2="140" />
      <line x1="420" y1="35" x2="420" y2="140" />
    </g>

    <!-- Cap Top Highlight -->
    <ellipse cx="300" cy="35" rx="130" ry="12" fill="#ef4444" opacity="0.6" />
  </g>
</svg>
